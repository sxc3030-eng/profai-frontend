<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>profAI - Ton prof personnel</title>
<style>
:root { --bg:#0f172a; --bg2:#1e293b; --bg3:#334155; --fg:#f1f5f9; --fg2:#94a3b8; --blue:#38bdf8; --purple:#818cf8; --green:#34d399; --amber:#fbbf24; --red:#f87171; --font:'Segoe UI',system-ui,sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--fg); height:100vh; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100vh; max-width:800px; margin:0 auto; border-left:1px solid var(--bg3); border-right:1px solid var(--bg3); }

/* Header */
#header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--bg2); border-bottom:1px solid var(--bg3); flex-shrink:0; }
#header .logo { font-size:1.15rem; font-weight:700; }
#header .logo span { color:var(--blue); }
.spacer { flex:1; }
#gradeBadge { display:none; padding:4px 10px; border-radius:20px; background:var(--bg3); font-size:0.75rem; color:var(--fg2); }
#langSelect { background:var(--bg3); color:var(--fg); border:1px solid var(--bg3); border-radius:8px; padding:4px 8px; font-size:0.8rem; cursor:pointer; font-family:inherit; }

/* Chat */
#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
.msg { display:flex; gap:8px; max-width:85%; animation:fadeIn .3s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } }
.msg.luce { align-self:flex-start; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg .avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.9rem; }
.msg.luce .avatar { background:linear-gradient(135deg,var(--blue),var(--purple)); }
.msg.user .avatar { background:var(--green); }
.msg .bubble { padding:10px 14px; border-radius:14px; line-height:1.55; font-size:0.92rem; }
.msg.luce .bubble { background:var(--bg2); border-bottom-left-radius:4px; color:var(--fg); }
.msg.user .bubble { background:var(--blue); border-bottom-right-radius:4px; color:#0f172a; font-weight:500; }

/* Suggestions */
.suggestions { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
.suggestions button { padding:7px 12px; border-radius:20px; border:1px solid var(--bg3); background:var(--bg); color:var(--blue); font-size:0.82rem; cursor:pointer; font-family:inherit; transition:all .15s; }
.suggestions button:hover { border-color:var(--blue); background:var(--bg2); }

/* Typing indicator */
.typing { color:var(--fg2); font-style:italic; padding:8px 14px; font-size:0.85rem; }

/* Input */
#inputArea { display:none; gap:8px; padding:10px 16px; border-top:1px solid var(--bg3); background:var(--bg2); flex-shrink:0; }
#inputArea.visible { display:flex; }
#inputArea textarea { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--bg3); background:var(--bg); color:var(--fg); font-family:inherit; font-size:0.92rem; resize:none; rows:1; max-height:100px; outline:none; }
#inputArea textarea:focus { border-color:var(--blue); }
#inputArea button { padding:10px 16px; border-radius:10px; border:none; background:var(--blue); color:#0f172a; font-weight:700; font-size:0.85rem; cursor:pointer; font-family:inherit; }
#inputArea button:disabled { opacity:.4; cursor:default; }

/* Welcome */
.welcome { text-align:center; padding:50px 20px; }
.welcome h1 { font-size:1.8rem; margin-bottom:6px; }
.welcome h1 span { color:var(--blue); }
.welcome p { color:var(--fg2); margin-bottom:20px; font-size:0.95rem; }
.welcome .grade-pick { display:flex; flex-direction:column; gap:6px; max-width:300px; margin:0 auto; }
.welcome .grade-pick button { padding:14px 16px; border-radius:12px; border:2px solid var(--bg3); background:var(--bg2); color:var(--fg); font-size:0.95rem; cursor:pointer; font-family:inherit; transition:all .15s; text-align:left; }
.welcome .grade-pick button:hover { border-color:var(--blue); }
.welcome .grade-pick button .age { color:var(--fg2); font-size:0.78rem; }

/* Feed */
#feedPanel { display:none; position:fixed; right:8px; top:60px; width:260px; background:var(--bg2); border-radius:12px; border:1px solid var(--bg3); max-height:calc(100vh - 80px); overflow-y:auto; padding:6px; z-index:50; }
#feedPanel.active { display:block; }
.rss-card { background:var(--bg3); border-radius:8px; overflow:hidden; margin-bottom:5px; cursor:pointer; border:1px solid transparent; }
.rss-card:hover { border-color:var(--blue); }
.rss-card img { width:100%; height:90px; object-fit:cover; display:block; }
.rss-card-body { padding:5px 7px; }
.rss-card-body h4 { font-size:0.73rem; margin-bottom:2px; }
.rss-card-body .rss-link { font-size:0.63rem; color:var(--blue); word-break:break-all; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="logo">🎓 <span>profAI</span></div>
    <div class="spacer"></div>
    <span class="grade-badge" id="gradeBadge"></span>
    <select id="langSelect" onchange="changeLang()">
      <option value="fr">🇫🇷</option>
      <option value="en">🇬🇧</option>
    </select>
    <button onclick="toggleFeed()" style="background:var(--bg3);color:var(--fg);border:none;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:0.85rem">📡</button>
    <button onclick="resetChat()" style="background:var(--bg3);color:var(--fg);border:none;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:0.85rem">↺</button>
  </div>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h1>Bonjour, <span>je suis ton prof</span></h1>
      <p>Choisis ton niveau et on commence.</p>
      <div class="grade-pick">
        <button onclick="startChat('secondary_3')">📘 Secondaire 3 <span class="age">14-15 ans</span></button>
        <button onclick="startChat('secondary_4')">📗 Secondaire 4 <span class="age">15-16 ans</span></button>
        <button onclick="startChat('secondary_5')">📙 Secondaire 5 <span class="age">16-17 ans</span></button>
        <button onclick="startChat('cegep')">🎒 Cégep <span class="age">17-20 ans</span></button>
        <button onclick="startChat('university')">🎓 Université <span class="age">20+ ans</span></button>
      </div>
    </div>
  </div>

  <div id="inputArea">
    <textarea id="userInput" placeholder="Ecris ton message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <button onclick="sendMessage()" id="sendBtn">Envoyer</button>
  </div>
</div>

<div id="feedPanel">
  <div id="rssLoading" style="text-align:center;padding:10px;color:var(--fg2);font-size:0.75rem">Chargement...</div>
  <div id="rssItems" style="display:none"></div>
</div>

<script>
var S = {
  lang: 'fr',
  grade: null,
  sessionId: Math.random().toString(36).slice(2,10),
  messages: []
};
// Auto-detect API URL
var API = (function(){
  var h = window.location.hostname;
  if (h === '127.0.0.1' || h === 'localhost') return 'http://127.0.0.1:8100/api';
  var saved = localStorage.getItem('profai_backend');
  if (saved) return saved;
  return 'http://ORACLE_IP:8100/api'; // Remplacer par l'IP Oracle
})();

function setBackend(url) {
  localStorage.setItem('profai_backend', url);
  API = url;
  alert('Backend configuré: ' + url);
  location.reload();
}

function changeLang(){ S.lang = document.getElementById('langSelect').value; }

async function startChat(grade){
  S.grade = grade;
  S.messages = [];
  S.sessionId = Math.random().toString(36).slice(2,10);
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('inputArea').classList.add('visible');
  var badge = document.getElementById('gradeBadge');
  badge.style.display = '';
  var labels = {secondary_3:'Sec 3',secondary_4:'Sec 4',secondary_5:'Sec 5',cegep:'Cegep',university:'Uni'};
  badge.textContent = '📚 ' + (labels[grade]||grade);

  try {
    var res = await fetch(API+'/chat/start', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({grade:grade,lang:S.lang,session_id:S.sessionId})
    });
    var data = await res.json();
    addMsg('luce', data.message, data.suggestions);
    render();
  } catch(e){
    addMsg('luce', 'Bonjour ! Selon ton niveau de '+labels[grade]+', nous pourrions aborder les maths, les sciences, le francais, lhistoire... As-tu une preference ?', ['Les maths','Les sciences','Le francais','Lhistoire']);
    render();
  }
}

async function sendMessage(){
  var input = document.getElementById('userInput');
  var text = input.value.trim();
  if(!text || !S.grade) return;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  addMsg('user', text);
  addTyping();

  try {
    var res = await fetch(API+'/chat/message', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,grade:S.grade,lang:S.lang,session_id:S.sessionId})
    });
    var data = await res.json();
    removeTyping();
    addMsg('luce', data.message, data.suggestions);
    render();
  } catch(e){
    removeTyping();
    addMsg('luce', 'Je reflechis... Peux-tu me dire ce qui tinteresse le plus ?', ['Les maths','Le francais','Les sciences','Aide aux devoirs']);
    render();
  }
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('userInput').focus();
}

function addMsg(role, text, suggestions){
  S.messages.push({role:role,text:text,suggestions:suggestions||null});
}

function addTyping(){
  var d = document.createElement('div');
  d.className = 'typing'; d.id = 'typing';
  d.innerHTML = '● ● ●';
  document.getElementById('chat').appendChild(d);
}
function removeTyping(){
  var t = document.getElementById('typing');
  if(t) t.remove();
}

function render(){
  var chat = document.getElementById('chat');
  chat.querySelectorAll('.msg,.typing').forEach(function(e){e.remove();});
  S.messages.forEach(function(m,i){
    var d = document.createElement('div');
    d.className = 'msg ' + m.role;
    var avatar = m.role==='luce' ? '🎓' : '👤';
    var h = '<div class="avatar">'+avatar+'</div>';
    h += '<div class="bubble">'+esc(m.text);
    if(m.suggestions && i===S.messages.length-1 && m.role==='luce'){
      h += '<div class="suggestions">';
      m.suggestions.forEach(function(s){
        h += '<button onclick="pick(\''+esc(s)+'\')">'+esc(s)+'</button>';
      });
      h += '</div>';
    }
    h += '</div>';
    d.innerHTML = h;
    chat.appendChild(d);
  });
  chat.scrollTop = chat.scrollHeight;
}

function pick(text){
  document.getElementById('userInput').value = text;
  sendMessage();
}

function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function resetChat(){
  S.grade = null; S.messages = [];
  document.getElementById('welcome').style.display = '';
  document.getElementById('inputArea').classList.remove('visible');
  document.getElementById('gradeBadge').style.display = 'none';
  document.getElementById('chat').querySelectorAll('.msg').forEach(function(e){e.remove();});
}

// RSS Feed
var feedVisible = false;
function toggleFeed(){
  feedVisible = !feedVisible;
  document.getElementById('feedPanel').classList.toggle('active',feedVisible);
  if(feedVisible) loadFeed();
}
async function loadFeed(){
  var RSS = 'https://sxc3030-eng.github.io/omnipost-rss/rss.xml';
  var loading = document.getElementById('rssLoading');
  var items = document.getElementById('rssItems');
  try {
    var res = await fetch(RSS);
    var xml = await res.text();
    var parser = new DOMParser();
    var doc = parser.parseFromString(xml,'application/xml');
    var nodes = doc.querySelectorAll('item');
    var h = '';
    nodes.forEach(function(item){
      var title = item.querySelector('title')?.textContent||'';
      var link = item.querySelector('link')?.textContent||'#';
      var thumb = item.querySelector('thumbnail')?.getAttribute('url')||item.querySelector('enclosure')?.getAttribute('url')||'';
      h += '<div class="rss-card" onclick="window.open(\''+link+'\',\'_blank\')">'
        + (thumb?'<img src="'+thumb+'" alt="'+title+'" loading="lazy" onerror="this.style.display=\'none\'">':'')
        + '<div class="rss-card-body"><h4>'+title+'</h4><div class="rss-link">'+link.replace(/^https?:\/\//,'').substring(0,30)+'...</div></div></div>';
    });
    items.innerHTML = h;
    loading.style.display = 'none';
    items.style.display = '';
  } catch(e){ loading.textContent = 'Flux indisponible'; }
}
</script>
</body>
</html>
