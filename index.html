<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>profAI - Ton prof personnel</title>
<style>
:root { --bg:#0f172a; --bg2:#1e293b; --bg3:#334155; --fg:#f1f5f9; --fg2:#94a3b8; --blue:#38bdf8; --purple:#818cf8; --green:#34d399; --amber:#fbbf24; --red:#f87171; --font:'Segoe UI',system-ui,sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg); color:var(--fg); height:100vh; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100vh; max-width:800px; margin:0 auto; border-left:1px solid var(--bg3); border-right:1px solid var(--bg3); }
#header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--bg2); border-bottom:1px solid var(--bg3); flex-shrink:0; }
#header .logo { font-size:1.15rem; font-weight:700; }
#header .logo span { color:var(--blue); }
.spacer { flex:1; }
#gradeBadge { display:none; padding:4px 10px; border-radius:20px; background:var(--bg3); font-size:0.75rem; color:var(--fg2); }
#langSelect { background:var(--bg3); color:var(--fg); border:1px solid var(--bg3); border-radius:8px; padding:4px 8px; font-size:0.8rem; cursor:pointer; font-family:inherit; }
#header button { background:var(--bg3); color:var(--fg); border:none; border-radius:8px; padding:5px 10px; cursor:pointer; font-size:0.85rem; font-family:inherit; }
#header button:hover { background:#475569; }

#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
.msg { display:flex; gap:8px; max-width:85%; animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} }
.msg.luce { align-self:flex-start; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg .avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.9rem; }
.msg.luce .avatar { background:linear-gradient(135deg,var(--blue),var(--purple)); }
.msg.user .avatar { background:var(--green); }
.msg .bubble { padding:10px 14px; border-radius:14px; line-height:1.55; font-size:0.92rem; }
.msg.luce .bubble { background:var(--bg2); border-bottom-left-radius:4px; color:var(--fg); }
.msg.user .bubble { background:var(--blue); border-bottom-right-radius:4px; color:#0f172a; font-weight:500; }

#inputArea { display:none; gap:8px; padding:10px 16px; border-top:1px solid var(--bg3); background:var(--bg2); flex-shrink:0; }
#inputArea.visible { display:flex; }
#inputArea textarea { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--bg3); background:var(--bg); color:var(--fg); font-family:inherit; font-size:0.92rem; resize:none; rows:1; max-height:100px; outline:none; }
#inputArea textarea:focus { border-color:var(--blue); }
#inputArea button { padding:10px 16px; border-radius:10px; border:none; background:var(--blue); color:#0f172a; font-weight:700; font-size:0.85rem; cursor:pointer; font-family:inherit; }
#inputArea button:disabled { opacity:.4; cursor:default; }

#welcome { text-align:center; padding:50px 20px; }
#welcome.hidden { display:none; }
#welcome h1 { font-size:1.8rem; margin-bottom:6px; }
#welcome h1 span { color:var(--blue); }
#welcome p { color:var(--fg2); margin-bottom:20px; font-size:0.95rem; }
#welcome .grade-pick { display:flex; flex-direction:column; gap:6px; max-width:300px; margin:0 auto; }
#welcome .grade-pick button { padding:14px 16px; border-radius:12px; border:2px solid var(--bg3); background:var(--bg2); color:var(--fg); font-size:0.95rem; cursor:pointer; font-family:inherit; text-align:left; transition:all .15s; }
#welcome .grade-pick button:hover { border-color:var(--blue); }
#welcome .grade-pick button .age { color:var(--fg2); font-size:0.78rem; }

#setupBox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200; justify-content:center; align-items:center; }
#setupBox.active { display:flex; }
#setupBox .box { background:var(--bg2); border-radius:16px; padding:24px; max-width:400px; width:90%; border:1px solid var(--bg3); }
#setupBox h2 { margin-bottom:12px; }
#setupBox input { width:100%; padding:10px; border-radius:8px; border:1px solid var(--bg3); background:var(--bg); color:var(--fg); font-family:inherit; font-size:0.9rem; margin-bottom:10px; }
#setupBox .note { font-size:0.75rem; color:var(--fg2); margin-bottom:10px; }
#setupBox button { width:100%; padding:10px; border-radius:8px; border:none; background:var(--blue); color:#0f172a; font-weight:700; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="logo">🎓 <span>profAI</span></div>
    <div class="spacer"></div>
    <span class="grade-badge" id="gradeBadge"></span>
    <select id="langSelect" onchange="changeLang()">
      <option value="fr">🇫🇷</option>
      <option value="en">🇬🇧</option>
    </select>
    <button onclick="toggleFeed()">📡</button>
    <button onclick="resetAll()">↺</button>
  </div>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h1>Bonjour, <span>je suis ton prof</span></h1>
      <p>Choisis ton niveau et on commence.</p>
      <div class="grade-pick">
        <button onclick="start('secondary_3')">📘 Secondaire 3 <span class="age">14-15 ans</span></button>
        <button onclick="start('secondary_4')">📗 Secondaire 4 <span class="age">15-16 ans</span></button>
        <button onclick="start('secondary_5')">📙 Secondaire 5 <span class="age">16-17 ans</span></button>
        <button onclick="start('cegep')">🎒 Cégep <span class="age">17-20 ans</span></button>
        <button onclick="start('university')">🎓 Université <span class="age">20+ ans</span></button>
      </div>
    </div>
  </div>

  <div id="inputArea">
    <textarea id="userInput" placeholder="Écris ton message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
    <button onclick="sendMsg()" id="sendBtn">Envoyer</button>
  </div>
</div>

<div id="setupBox">
  <div class="box">
    <h2>🔗 Configure ton serveur</h2>
    <p class="note">Entre l'URL de ton serveur profAI.<br>Exemple: http://12.34.56.78:8100/api</p>
    <input type="text" id="backendUrl" placeholder="http://TON_IP:8100/api">
    <p class="note" style="color:var(--amber)">⚠️ Le serveur doit être en HTTP (pas HTTPS) pour le moment.</p>
    <button onclick="saveBackend()">Connecter</button>
  </div>
</div>

<script>
var S = { lang:'fr', grade:null, sid:Math.random().toString(36).slice(2,10), speaking:false };

// API: localhost en dev, configurée en prod
var API = (function(){
  if (window.location.hostname==='127.0.0.1'||window.location.hostname==='localhost') return 'http://127.0.0.1:8100/api';
  return localStorage.getItem('profai_backend') || null;
})();

function changeLang(){ S.lang=document.getElementById('langSelect').value; }

function saveBackend(){
  var url = document.getElementById('backendUrl').value.trim();
  if (!url) return;
  localStorage.setItem('profai_backend', url);
  API = url;
  document.getElementById('setupBox').classList.remove('active');
  // Relancer le start
  if (S.grade) start(S.grade);
}

async function start(grade){
  // Si pas de backend configuré, demander
  if (!API) {
    document.getElementById('setupBox').classList.add('active');
    return;
  }

  S.grade=grade; S.sid=Math.random().toString(36).slice(2,10);
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('inputArea').classList.add('visible');
  var badge=document.getElementById('gradeBadge');
  badge.style.display='';
  var labels={secondary_3:'Sec 3',secondary_4:'Sec 4',secondary_5:'Sec 5',cegep:'Cégep',university:'Uni'};
  badge.textContent='📚 '+(labels[grade]||grade);
  document.getElementById('chat').querySelectorAll('.msg').forEach(function(e){e.remove();});

  try {
    var res=await fetch(API+'/chat/start',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({grade:grade,lang:S.lang,session_id:S.sid})
    });
    var data=await res.json();
    addMsg('luce',data.message);
  } catch(e){
    addMsg('luce','Bonjour ! Selon ton niveau de '+labels[grade]+', nous allons travailler ensemble. Dis-moi ce que tu veux apprendre ou sur quel devoir tu veux travailler.');
  }
}

async function sendMsg(){
  var input=document.getElementById('userInput');
  var text=input.value.trim();
  if(!text||!S.grade) return;
  input.value='';
  document.getElementById('sendBtn').disabled=true;
  addMsg('user',text);

  try {
    var res=await fetch(API+'/chat/message',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,grade:S.grade,lang:S.lang,session_id:S.sid})
    });
    var data=await res.json();
    addMsg('luce',data.message);
    if (data.message) speak(data.message);
  } catch(e){
    addMsg('luce','Je réfléchis... Dis-m\'en plus sur ce que tu veux apprendre.');
  }
  document.getElementById('sendBtn').disabled=false;
  document.getElementById('userInput').focus();
}

function addMsg(role,text){
  var div=document.createElement('div');
  div.className='msg '+role;
  div.innerHTML='<div class="avatar">'+(role==='luce'?'🎓':'👤')+'</div><div class="bubble">'+esc(text)+'</div>';
  document.getElementById('chat').appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
}

function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=S.lang==='fr'?'fr-CA':'en-US';
  u.rate=0.95;
  S.speaking=true;
  u.onend=function(){S.speaking=false;};
  speechSynthesis.speak(u);
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

function resetAll(){
  S.grade=null;
  document.getElementById('welcome').classList.remove('hidden');
  document.getElementById('inputArea').classList.remove('visible');
  document.getElementById('gradeBadge').style.display='none';
  document.getElementById('chat').querySelectorAll('.msg').forEach(function(e){e.remove();});
  if(window.speechSynthesis) speechSynthesis.cancel();
}

// RSS Feed
var feedVis=false;
function toggleFeed(){
  feedVis=!feedVis;
  var p=document.getElementById('feedPanel');
  if(!p){
    p=document.createElement('div'); p.id='feedPanel';
    p.style.cssText='display:none;position:fixed;right:8px;top:50px;width:240px;background:var(--bg2);border-radius:10px;border:1px solid var(--bg3);max-height:calc(100vh-70px);overflow-y:auto;padding:6px;z-index:50;font-size:0.7rem';
    document.body.appendChild(p);
  }
  p.style.display=feedVis?'':'none';
  if(feedVis) loadFeed(p);
}
async function loadFeed(p){
  try{
    var r=await fetch('https://sxc3030-eng.github.io/omnipost-rss/rss.xml');
    var x=await r.text();
    var d=new DOMParser().parseFromString(x,'application/xml');
    var h='';
    d.querySelectorAll('item').forEach(function(i){
      var t=i.querySelector('title')?.textContent||'';
      var l=i.querySelector('link')?.textContent||'#';
      var img=i.querySelector('thumbnail')?.getAttribute('url')||i.querySelector('enclosure')?.getAttribute('url')||'';
      h+='<div style="background:var(--bg3);border-radius:6px;overflow:hidden;margin-bottom:4px;cursor:pointer;border:1px solid transparent" onclick="window.open(\''+l+'\',\'_blank\')" onmouseover="this.style.borderColor=\'var(--blue)\'" onmouseout="this.style.borderColor=\'transparent\'">'
        +(img?'<img src="'+img+'" style="width:100%;height:70px;object-fit:cover" loading="lazy" onerror="this.style.display=\'none\'">':'')
        +'<div style="padding:4px 6px"><b style="font-size:0.7rem">'+t+'</b><div style="color:var(--blue);font-size:0.6rem">'+l.replace(/^https?:\/\//,'').substring(0,25)+'...</div></div></div>';
    });
    p.innerHTML=h||'<p style="color:var(--fg2);text-align:center;padding:8px">Aucune annonce</p>';
  }catch(e){ p.innerHTML='<p style="color:var(--fg2);text-align:center;padding:8px">Flux indisponible</p>'; }
}
</script>
</body>
</html>
